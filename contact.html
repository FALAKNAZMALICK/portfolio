<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Falak Naz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-4xl mx-auto px-6 py-8 bg-[#F9FAFB] text-[#111827]">
    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-12 border-b pb-4">
        <div class="font-bold text-xl text-[#1E293B]">Falak Naz</div>
        <div class="space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-[#D97706]">Home</a>
            <a href="cases.html" class="hover:text-[#D97706]">Case Studies</a>
            <a href="about.html" class="hover:text-[#D97706]">About</a>
            <a href="contact.html" class="text-[#D97706]">Contact</a>
        </div>
    </nav>

    <h1 class="text-3xl font-bold text-[#1E293B] mb-6">Get In Touch</h1>
    <p class="text-gray-600 mb-8">Interested in discussing data engineering projects or scheduling a technical interview? Feel free to reach out directly.</p>

    <div class="bg-white p-6 border rounded-lg mb-8 max-w-lg">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
            <input type="email" class="w-full border p-2 rounded focus:outline-none focus:ring-1 focus:ring-[#D97706]" placeholder="recruiter@company.com">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea class="w-full border p-2 rounded h-24 focus:outline-none focus:ring-1 focus:ring-[#D97706]" placeholder="Schedule an interview..."></textarea>
        </div>
        <button class="bg-[#1E293B] text-white px-6 py-2 rounded font-medium hover:bg-slate-700 w-full">Send Message</button>
    </div>

    <div class="space-y-2 text-sm text-gray-600">
        <p><strong>GitHub:</strong> <a href="https://github.com/FALAKNAZMALICK" class="text-[#D97706] hover:underline">github.com/FALAKNAZMALICK</a></p>
        <p><strong>LinkedIn:</strong> <a href="https://linkedin.com/in/falaknaz-" class="text-[#D97706] hover:underline">linkedin.com/in/falaknaz-</a></p>
    </div>
